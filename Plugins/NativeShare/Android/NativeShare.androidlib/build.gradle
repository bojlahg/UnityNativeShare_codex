apply plugin: 'com.android.library'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.fragment:fragment:1.5.7"
    implementation "androidx.activity:activity:1.6.1"
}

android {
    // Reuse Unity/Root project versions if they exist, otherwise fall back to sane defaults
    def _compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    def _minSdk     = rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
    def _targetSdk  = rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : _compileSdk

    compileSdkVersion _compileSdk
	buildToolsVersion "34.0.0"

    defaultConfig {
        minSdkVersion _minSdk
        targetSdkVersion _targetSdk
    }
}